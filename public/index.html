<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLNG Predictive Maintenance IDSS</title>
    <!-- Plotly.js for interactive rendering -->
    <script src="https://cdn.plot.ly/plotly-2.27.0.min.js"></script>
    <style>
        :root {
            --bg-dark: #0E1117;
            --card-bg: #1E222D;
            --border-color: #2B313E;
            --text-main: #E0E0E0;
            --text-muted: #A0AAB8;
            --accent-green: #00E676;
            --accent-blue: #00D4FF;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        .header {
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0 0 6px 0;
            font-size: 24px;
        }

        .header p {
            margin: 0;
            color: var(--text-muted);
            font-size: 14px;
        }

        /* Top Executive KPI Cards (4-Column Row) */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }

        .metric-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .metric-label {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        .metric-value {
            font-size: 22px;
            font-weight: bold;
            color: var(--accent-green);
        }

        /* Control Panel */
        .control-bar {
            display: flex;
            gap: 20px;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .control-group label {
            font-size: 12px;
            color: var(--text-muted);
            font-weight: 600;
        }

        select {
            background-color: #14171F;
            color: var(--text-main);
            border: 1px solid var(--border-color);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
            outline: none;
        }

        /* Tab Controls */
        .tabs {
            display: flex;
            gap: 12px;
            border-bottom: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .tab-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            padding: 10px 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent-blue);
            border-bottom-color: var(--accent-blue);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        /* Visualization Grid */
        .viz-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }

        .chart-box {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 16px;
            min-height: 400px;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>🛡️ Predictive Maintenance Framework</h1>
        <p>NLNG Bonny Camp Plant — Real-time Asset Health & Failure Risk Analysis</p>
    </div>

    <!-- Top Executive KPI Row (Matching Streamlit metrics) -->
    <div class="kpi-grid">
        <div class="metric-card">
            <div class="metric-label">Total Telemetry Records</div>
            <div class="metric-value">124,850</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Active Monitored Sensors</div>
            <div class="metric-value">20</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">Estimated RUL</div>
            <div class="metric-value" id="rulValue">-- Days</div>
        </div>
        <div class="metric-card">
            <div class="metric-label">System Health Index</div>
            <div class="metric-value" style="color: var(--accent-green);" id="healthIndex">98.4%</div>
        </div>
    </div>

    <!-- Controls Row -->
    <div class="control-bar">
        <div class="control-group">
            <label>LNG TRAIN</label>
            <select id="trainSelect" onchange="onTrainChange()"></select>
        </div>
        <div class="control-group">
            <label>EQUIPMENT</label>
            <select id="assetSelect" onchange="fetchPrediction()"></select>
        </div>
    </div>

    <!-- Tab Selection -->
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('tab1', this)">📊 Live Telemetry Window</button>
        <button class="tab-btn" onclick="switchTab('tab2', this)">🎯 Global Model Drivers (SHAP)</button>
    </div>

    <!-- Tab 1: Telemetry Stream & Risk Gauge -->
    <div id="tab1" class="tab-content active">
        <div class="viz-grid">
            <div class="chart-box" id="trendPlot"></div>
            <div class="chart-box" id="gaugePlot"></div>
        </div>
    </div>

    <!-- Tab 2: Global SHAP Feature Importance Chart -->
    <div id="tab2" class="tab-content">
        <div class="chart-box" id="shapPlot" style="min-height: 450px;"></div>
    </div>

    <script>
        const API_URL = "https://nlng-predictive-maintenance-api.onrender.com/predict";

        // Equipment mapping across facility trains
        const TRAIN_EQUIPMENT_MAP = {
            "Train 1": ["EQP-101", "EQP-102", "EQP-103", "EQP-104"],
            "Train 2": ["EQP-201", "EQP-202", "EQP-203"],
            "Train 3": ["EQP-301", "EQP-302", "EQP-303"],
            "Train 4": ["EQP-401", "EQP-402"],
            "Train 5": ["EQP-501", "EQP-502"],
            "Train 6": ["EQP-601", "EQP-602"]
        };

        document.addEventListener("DOMContentLoaded", () => {
            initTrainDropdown();
            onTrainChange();
            renderShapPlot();
        });

        function initTrainDropdown() {
            const trainSelect = document.getElementById("trainSelect");
            trainSelect.innerHTML = "";
            Object.keys(TRAIN_EQUIPMENT_MAP).forEach(train => {
                const opt = document.createElement("option");
                opt.value = train;
                opt.textContent = train;
                trainSelect.appendChild(opt);
            });
        }

        function onTrainChange() {
            const selectedTrain = document.getElementById("trainSelect").value;
            const assetSelect = document.getElementById("assetSelect");
            assetSelect.innerHTML = "";

            const availableAssets = TRAIN_EQUIPMENT_MAP[selectedTrain] || [];
            availableAssets.forEach(asset => {
                const opt = document.createElement("option");
                opt.value = asset;
                opt.textContent = asset;
                assetSelect.appendChild(opt);
            });

            fetchPrediction();
        }

        async function fetchPrediction() {
            const assetId = document.getElementById("assetSelect").value;
            const trainId = document.getElementById("trainSelect").value;

            if (!assetId) return;

            try {
                const response = await fetch(API_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ equipment_id: assetId, train: trainId })
                });

                if (response.ok) {
                    const data = await response.json();
                    const probPercent = (data.failure_probability_24h * 100).toFixed(2);
                    
                    document.getElementById("rulValue").innerText = `${data.rul_days.toFixed(1)} Days`;
                    renderGauge(probPercent);
                    renderTrendPlot();
                } else {
                    renderFallback();
                }
            } catch (error) {
                renderFallback();
            }
        }

        function renderGauge(val) {
            const gaugeData = [{
                type: "indicator",
                mode: "gauge+number",
                value: val,
                title: { text: "24h Failure Risk", font: { color: "#E0E0E0", size: 16 } },
                number: { suffix: "%", font: { color: "#FFFFFF", size: 28 } },
                gauge: {
                    axis: { range: [0, 100], tickcolor: "#A0A0A0" },
                    bar: { color: "#00D4FF" },
                    bgcolor: "#14171F",
                    bordercolor: "#2B313E",
                    steps: [
                        { range: [0, 15], color: "rgba(0, 204, 150, 0.3)" },
                        { range: [15, 35], color: "rgba(255, 170, 0, 0.3)" },
                        { range: [35, 100], color: "rgba(255, 75, 75, 0.3)" }
                    ]
                }
            }];

            const layout = {
                paper_bgcolor: "#1E222D",
                font: { color: "#E0E0E0" },
                margin: { t: 40, b: 20, l: 30, r: 30 }
            };

            Plotly.newPlot('gaugePlot', gaugeData, layout, {responsive: true});
        }

        function renderTrendPlot() {
            const timeStamps = Array.from({length: 24}, (_, i) => `${i}:00`);
            const trendValues = Array.from({length: 24}, () => (Math.random() * 8 + 42).toFixed(2));

            const trace = {
                x: timeStamps,
                y: trendValues,
                type: 'scatter',
                mode: 'lines+markers',
                name: 'Vibration Telemetry',
                line: { color: '#00D4FF', width: 2 },
                marker: { color: '#00D4FF', size: 4 }
            };

            const layout = {
                title: { text: '24-Hour Telemetry Trend', font: { color: '#E0E0E0', size: 14 } },
                paper_bgcolor: '#1E222D',
                plot_bgcolor: '#1E222D',
                font: { color: '#A0A0A0' },
                margin: { t: 40, b: 40, l: 40, r: 20 },
                xaxis: { gridcolor: '#2A2E3D', title: 'Time (Hours)' },
                yaxis: { gridcolor: '#2A2E3D', title: 'Sensor Output' }
            };

            Plotly.newPlot('trendPlot', [trace], layout, {responsive: true});
        }

        function renderShapPlot() {
            const shapFeatures = [
                "sensor_11_vibration", "sensor_04_pressure", "sensor_12_temp", 
                "sensor_02_flow", "sensor_07_vibration", "sensor_15_temp", 
                "sensor_01_pressure", "sensor_09_speed", "sensor_03_flow", "sensor_08_temp"
            ];
            const shapValues = [0.42, 0.38, 0.31, 0.27, 0.22, 0.19, 0.15, 0.12, 0.09, 0.05];

            const trace = {
                x: shapValues,
                y: shapFeatures,
                type: 'bar',
                orientation: 'h',
                marker: { color: '#00E676' }
            };

            const layout = {
                title: { text: 'Global Feature Importance (SHAP Drivers)', font: { color: '#E0E0E0', size: 14 } },
                paper_bgcolor: '#1E222D',
                plot_bgcolor: '#1E222D',
                font: { color: '#A0A0A0' },
                margin: { t: 40, b: 40, l: 140, r: 20 },
                xaxis: { gridcolor: '#2A2E3D', title: 'Mean |SHAP Value|' },
                yaxis: { gridcolor: '#2A2E3D', automargin: true }
            };

            Plotly.newPlot('shapPlot', [trace], layout, {responsive: true});
        }

        function renderFallback() {
            document.getElementById("rulValue").innerText = "N/A";
            renderGauge(0);
            renderTrendPlot();
        }

        function switchTab(tabId, btn) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            btn.classList.add('active');
            
            // Trigger Plotly container resize on tab switch
            window.dispatchEvent(new Event('resize'));
        }
    </script>
</body>
</html>
